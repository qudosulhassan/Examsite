<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practice Exam</title>
<style>
:root{
  --bg:#f4f6fb;--surface:#ffffff;--surface-2:#f8fafc;--border:#e2e8f0;--text:#0f172a;--muted:#64748b;
  --primary:#4f46e5;--primary-600:#4338ca;--primary-50:#eef2ff;
  --ok:#059669;--ok-50:#ecfdf5;--bad:#dc2626;--bad-50:#fef2f2;--warn:#d97706;--warn-50:#fffbeb;--info:#0284c7;--info-50:#f0f9ff;
  --radius:14px;--shadow:0 1px 2px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1020;--surface:#121829;--surface-2:#0f1524;--border:#243049;--text:#e5e9f2;--muted:#94a3b8;
    --primary:#818cf8;--primary-600:#6366f1;--primary-50:#1e2446;
    --ok:#34d399;--ok-50:#0f2a22;--bad:#f87171;--bad-50:#2d1416;--warn:#fbbf24;--warn-50:#2b2210;--info:#38bdf8;--info-50:#0c2231;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#0b1020;--surface:#121829;--surface-2:#0f1524;--border:#243049;--text:#e5e9f2;--muted:#94a3b8;
  --primary:#818cf8;--primary-600:#6366f1;--primary-50:#1e2446;
  --ok:#34d399;--ok-50:#0f2a22;--bad:#f87171;--bad-50:#2d1416;--warn:#fbbf24;--warn-50:#2b2210;--info:#38bdf8;--info-50:#0c2231;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow-x:hidden}
button{font:inherit;cursor:pointer}
a{color:var(--primary);word-break:break-all}
img{max-width:100%;height:auto}

/* Header */
.header{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--border);box-shadow:var(--shadow)}
.header-row{display:flex;align-items:center;gap:12px;padding:10px 20px;max-width:1400px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;white-space:nowrap}
.brand .logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--primary),#06b6d4);display:grid;place-items:center;color:#fff;font-size:15px}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--muted);line-height:1.1}
.progress-wrap{flex:1;min-width:0}
.progress-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:4px;gap:8px}
.progress-bar{height:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:99px;overflow:hidden}
.progress-bar>div{height:100%;background:linear-gradient(90deg,var(--primary),#06b6d4);width:0;transition:width .3s}
.stats{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;border:1px solid var(--border);background:var(--surface-2);white-space:nowrap}
.pill.ok{color:var(--ok);background:var(--ok-50);border-color:transparent}
.pill.bad{color:var(--bad);background:var(--bad-50);border-color:transparent}
.pill.warn{color:var(--warn);background:var(--warn-50);border-color:transparent}
.icon-btn{border:1px solid var(--border);background:var(--surface-2);color:var(--text);border-radius:10px;padding:7px 10px;line-height:1}
.menu-btn{display:none}

/* Layout */
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;max-width:1400px;margin:0 auto;padding:20px}
.sidebar{position:sticky;top:84px;align-self:start;max-height:calc(100vh - 104px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.side-head{padding:14px;border-bottom:1px solid var(--border)}
.side-head h2{margin:0 0 10px;font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.search{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);color:var(--text);font:inherit;font-size:14px}
.filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--border);background:var(--surface-2);color:var(--muted)}
.chip.active{background:var(--primary);border-color:var(--primary);color:#fff}
.nav-grid{padding:14px;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.nav-btn{height:38px;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:13px;font-weight:600;position:relative}
.nav-btn.current{outline:2px solid var(--primary);outline-offset:1px;background:var(--primary-50)}
.nav-btn.correct{background:var(--ok-50);color:var(--ok);border-color:var(--ok)}
.nav-btn.incorrect{background:var(--bad-50);color:var(--bad);border-color:var(--bad)}
.nav-btn.revealed{background:var(--warn-50);color:var(--warn);border-color:var(--warn)}
.nav-btn.locked{opacity:.45;cursor:not-allowed}
.nav-btn.locked::after{content:"🔒";position:absolute;font-size:8px;right:2px;top:1px}
.nav-empty{grid-column:1/-1;color:var(--muted);font-size:13px;text-align:center;padding:10px}
.legend{padding:10px 14px;border-top:1px solid var(--border);display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}

/* Card */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px;min-width:0}
.q-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:14px}
.q-num{font-size:22px;font-weight:800;margin-right:4px}
.tag{font-size:12px;font-weight:600;padding:3px 9px;border-radius:7px;background:var(--primary-50);color:var(--primary)}
.tag.topic{background:var(--surface-2);color:var(--muted);border:1px solid var(--border)}
.q-text p{margin:0 0 10px}
.q-text{font-size:16.5px;overflow-wrap:anywhere}
.options{display:flex;flex-direction:column;gap:10px;margin:20px 0 6px;padding:0;list-style:none}
.opt{display:flex;gap:12px;align-items:flex-start;padding:13px 15px;border:1.5px solid var(--border);border-radius:12px;background:var(--surface-2);cursor:pointer;transition:border-color .15s,background .15s;min-height:48px}
.opt:hover{border-color:var(--primary)}
.opt input{margin-top:4px;width:18px;height:18px;accent-color:var(--primary);flex:none}
.opt .lab{font-weight:700;min-width:22px}
.opt .txt{flex:1;overflow-wrap:anywhere}
.opt.selected{border-color:var(--primary);background:var(--primary-50)}
.opt.is-correct{border-color:var(--ok);background:var(--ok-50)}
.opt.is-wrong{border-color:var(--bad);background:var(--bad-50)}
.opt.locked{cursor:default}
.select-hint{font-size:13px;color:var(--muted);margin-top:14px}

.answer-area{margin:20px 0 6px;border:1.5px dashed var(--border);border-radius:12px;padding:16px;background:var(--surface-2)}
.answer-area h3{margin:0 0 6px;font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.notice{font-size:14px;color:var(--muted);margin:0 0 12px}
.box-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--border)}
.box-row:first-of-type{border-top:0}
.box-row .bl{font-weight:600}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--text);padding:8px 18px;min-width:64px}
.seg button+button{border-left:1px solid var(--border)}
.seg button.on{background:var(--primary);color:#fff}
.seg button.good{background:var(--ok);color:#fff}
.seg button.badc{background:var(--bad);color:#fff}
.seg button:disabled{cursor:default}

.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.btn{border:1px solid var(--border);background:var(--surface-2);color:var(--text);border-radius:10px;padding:11px 18px;font-weight:600;min-height:44px}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-600)}
.btn.warn{color:var(--warn);border-color:var(--warn);background:transparent}
.btn.next{margin-left:auto;background:var(--ok);border-color:var(--ok);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.hidden{display:none!important}

.feedback{margin-top:18px;padding:12px 16px;border-radius:12px;font-weight:600}
.feedback.ok{background:var(--ok-50);color:var(--ok)}
.feedback.bad{background:var(--bad-50);color:var(--bad)}
.feedback.warn{background:var(--warn-50);color:var(--warn)}
.feedback.info{background:var(--info-50);color:var(--info)}

.answer-panel{margin-top:18px;border:1px solid var(--border);border-left:4px solid var(--primary);border-radius:12px;background:var(--surface-2);padding:18px 20px;overflow-wrap:anywhere}
.answer-panel h4{margin:14px 0 6px;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.answer-panel h4:first-child{margin-top:0}
.answer-panel .ca{font-size:18px;font-weight:800;color:var(--ok)}
.answer-panel ul{margin:4px 0;padding-left:20px}
.answer-panel p{margin:0 0 8px}
.answer-panel .na{color:var(--warn);font-weight:600}
.self-grade{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.self-grade span{font-size:14px;color:var(--muted);margin-right:4px}

/* Completion */
.complete{text-align:center;padding:40px 20px}
.complete h2{font-size:30px;margin:0 0 6px}
.score-big{font-size:54px;font-weight:800;color:var(--primary);margin:10px 0}
.res-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:22px auto;max-width:640px}
.res{border:1px solid var(--border);border-radius:12px;padding:12px;background:var(--surface-2)}
.res b{display:block;font-size:24px}
.res small{color:var(--muted)}

.exhibit{margin:16px 0;padding:10px;border:1px solid var(--border);border-radius:12px;background:#fff;text-align:center}
.exhibit img{display:block;margin:0 auto;max-width:100%;height:auto;cursor:zoom-in}
.exhibit figcaption{font-size:12px;color:#64748b;margin-top:6px}
.lightbox{position:fixed;inset:0;background:rgba(2,6,23,.88);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto;cursor:zoom-out}
.lightbox img{max-width:none;width:auto;max-height:none;background:#fff;border-radius:6px}
@media (max-width:760px){.lightbox{align-items:flex-start;justify-content:flex-start}}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px}
.chip-item{border:1.5px solid var(--primary);background:var(--primary-50);color:var(--text);border-radius:9px;padding:8px 12px;font-size:14px;cursor:grab;min-height:40px}
.chip-item.picked{background:var(--primary);color:#fff}
.chip-item:disabled{cursor:default;opacity:.7}
.ia-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(180px,300px);gap:6px 14px;align-items:center;padding:12px 10px;border-top:1px solid var(--border);border-radius:8px}
.ia-row:first-of-type{border-top:0}
.ia-row.droppable.over{background:var(--primary-50);outline:2px dashed var(--primary)}
.ia-row .seg{justify-self:end}
.ia-label{overflow-wrap:anywhere}
.ia-select{width:100%;min-height:44px;padding:8px 10px;border:1.5px dashed var(--border);border-radius:10px;background:var(--surface);color:var(--text);font:inherit;font-size:15px}
.ia-row.droppable .ia-select{border-color:var(--primary)}
.ia-row.row-ok{background:var(--ok-50)} .ia-row.row-ok .ia-select{border:1.5px solid var(--ok)}
.ia-row.row-bad{background:var(--bad-50)} .ia-row.row-bad .ia-select{border:1.5px solid var(--bad)}
.ia-fix{grid-column:1/-1;font-size:13.5px}
.ia-fix.ok{color:var(--ok)} .ia-fix.bad{color:var(--bad);font-weight:600} .ia-fix.info{color:var(--muted)}
.ia-fix:empty{display:none}
@media (max-width:760px){.ia-row{grid-template-columns:1fr}.ia-row .seg{justify-self:start}}
.backdrop{display:none}

/* Tablet */
@media (max-width:1024px){
  .layout{grid-template-columns:230px minmax(0,1fr);gap:14px;padding:14px}
  .card{padding:22px}
}
/* Mobile */
@media (max-width:760px){
  .menu-btn{display:inline-block}
  .header-row{flex-wrap:wrap;padding:10px 16px;gap:8px}
  .brand{font-size:16px;gap:8px;min-width:0}
  .brand .logo{width:28px;height:28px;font-size:13px}
  .stats{flex-wrap:nowrap}
  .pill{padding:3px 7px}
  .progress-wrap{order:3;flex-basis:100%}
  .stats{margin-left:auto}
  .brand small{display:none}
  .layout{grid-template-columns:minmax(0,1fr);padding:12px 16px}
  .sidebar{position:fixed;top:0;left:0;bottom:0;width:min(86vw,320px);max-height:none;border-radius:0 14px 14px 0;z-index:50;transform:translateX(-105%);transition:transform .25s}
  .sidebar.open{transform:none}
  .backdrop.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40}
  .card{padding:18px 16px}
  .q-num{font-size:19px}
  .q-text{font-size:16px}
  .actions .btn{flex:1 1 calc(50% - 10px)}
  .btn.next{margin-left:0;flex-basis:100%}
  .box-row{flex-wrap:wrap}
}
@media (max-width:420px){ .stats .pill.hide-xs{display:none} }
</style>
</head>
<body>
<header class="header">
  <div class="header-row">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open question navigator">☰</button>
    <div class="brand"><div class="logo" id="brandLogo">EX</div><div><span id="brandCode">Practice</span> Exam<small id="brandTitle"></small></div></div>
    <div class="progress-wrap">
      <div class="progress-meta"><span id="progText">Question 1 of 0</span><span id="progPct">0% complete</span></div>
      <div class="progress-bar"><div id="progBar"></div></div>
    </div>
    <div class="stats">
      <span class="pill ok" id="stOk">✓ 0</span>
      <span class="pill bad" id="stBad">✗ 0</span>
      <span class="pill warn hide-xs" id="stRev">👁 0</span>
    </div>
    <button class="icon-btn" id="themeBtn" aria-label="Toggle theme">◐</button>
  </div>
</header>

<div class="backdrop" id="backdrop"></div>
<div class="layout">
  <aside class="sidebar" id="sidebar" aria-label="Question navigator">
    <div class="side-head">
      <h2>Question Navigator</h2>
      <input class="search" id="search" type="search" placeholder="Search unlocked questions…" autocomplete="off">
      <div class="filter-row" id="filters">
        <button class="chip active" data-f="all">All</button>
        <button class="chip" data-f="correct">Correct</button>
        <button class="chip" data-f="incorrect">Incorrect</button>
        <button class="chip" data-f="revealed">Revealed</button>
      </div>
    </div>
    <div class="nav-grid" id="navGrid"></div>
    <div class="legend">
      <span style="--c:var(--ok)">Correct</span><span style="--c:var(--bad)">Incorrect</span><span style="--c:var(--warn)">Revealed</span><span style="--c:var(--border)">Locked</span>
    </div>
  </aside>

  <main id="main">
    <section class="card" id="qCard" aria-live="polite"></section>
    <section class="card complete hidden" id="doneCard"></section>
  </main>
</div>

<script>
/* ===================== EXAM DATA — the ONLY part to fill in =====================
   Replace the empty values below with the converted exam. Do not change the engine code under this block.

   EXAM_META   {code, title}
   QUESTIONS   visible question content only, in source order:
     { "id": 1,                       // question number from the source (1, 2, 3 …, unique)
       "topic": "Topic 1: …",         // topic/section name from the source, or ""
       "type": "multiple-choice" | "multiple-select" | "hotspot" | "drag-drop",
       "question": ["paragraph", …],  // question text split into paragraphs, exactly as in the source
       "options": [{"label":"A","text":"…"}, …],   // only for multiple-choice / multiple-select, else []
       "images": ["image3"],          // keys into QIMG for exhibit images shown with the question, else []
       "boxCount": 0, "yesNo": false, // legacy hotspot: N Yes/No boxes shown in an exhibit image
       "ia": null }                   // interactive answer area (preferred for hotspot / drag-drop), see below
     ia (interactive answer area), when the answer area can be written as rows:
       {"kind":"yesno",  "rows":[{"label":"statement 1"}, …]}                       // Yes/No per statement
       {"kind":"select", "rows":[{"label":"Box 1 text","choices":["a","b"]}, …]}   // drop-down per box
       {"kind":"match",  "pool":["item 1","item 2"], "rows":[{"label":"target 1"}, …]}  // drag items onto targets
       {"kind":"order",  "pool":["action 1","action 2"], "rows":[{"label":"Step 1"}, …]} // drag actions into order
   ANSWERS_B64  base64 of UTF-8 JSON  { "<id>": {
       "correctAnswer": ["C"] | ["B","D"] | null,  // option letters for multiple-choice / multiple-select
       "boxes": [{"box":1,"value":"Yes"}, …],       // legacy Yes/No box answers, else []
       "rowAnswers": ["Yes","No", …] | null,        // one answer per ia row, text must match a choice/pool item exactly
       "explanation": ["paragraph", {"img":"image9"}, …],  // explanation text (and images) from the source
       "reference": ["https://…"],                  // reference links from the source
       "answerImages": ["image4"] } }               // keys into AIMG for answer-area images from the source
   QIMG / AIMG  { "imageKey": "data:image/png;base64,…" }  (jpeg/png/gif/webp)
*/
const EXAM_META = {"code": "", "title": ""};
const QUESTIONS = [];
const ANSWERS_B64 = "e30=";
const QIMG = {};
const AIMG = {};
</script>
<script>
(function(){
"use strict";
const TOTAL = QUESTIONS.length;
let _answers = null;
function answerFor(id){
  if(!_answers){
    const bin = atob(ANSWERS_B64); const bytes = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    _answers = JSON.parse(new TextDecoder().decode(bytes));
  }
  return _answers[id];
}

/* ---------- state ---------- */
const STORE_KEY = "exam-state-" + (EXAM_META.code || "practice").toLowerCase() + "-" + TOTAL;
if(EXAM_META.code){ document.title = EXAM_META.code + " Practice Exam"; document.getElementById("brandCode").textContent = EXAM_META.code; document.getElementById("brandLogo").textContent = EXAM_META.code.replace(/[^A-Za-z]/g,"").slice(0,2).toUpperCase() || "EX"; }
if(EXAM_META.title){ document.getElementById("brandTitle").textContent = EXAM_META.title; }
function freshState(){ return {cur:0, furthest:0, q:{}}; }
let S = freshState();
try{ const raw = localStorage.getItem(STORE_KEY); if(raw){ const p = JSON.parse(raw); if(p && typeof p.cur==="number") S = p; } }catch(e){}
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }catch(e){} }
function qs(i){ const id = QUESTIONS[i].id; if(!S.q[id]) S.q[id] = {sel:[], boxes:{}, rows:{}, status:null}; return S.q[id]; }
// status: null | 'correct' | 'incorrect' | 'revealed' | 'reviewed'

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function paras(arr){ return (arr||[]).map(p=>`<p>${esc(p)}</p>`).join(""); }
function linkify(u){ const e = esc(u); return /^https?:\/\//.test(u) ? `<a href="${e}" target="_blank" rel="noopener noreferrer">${e}</a>` : e; }
const TYPE_LABEL = {"multiple-choice":"Multiple Choice","multiple-select":"Multiple Select","hotspot":"Hotspot","drag-drop":"Drag & Drop"};
function isDone(st){ return st && st.status !== null; }

/* ---------- render question ---------- */
function render(){
  const i = S.cur, q = QUESTIONS[i], st = qs(i);
  $("#doneCard").classList.add("hidden"); $("#qCard").classList.remove("hidden");
  const done = isDone(st);
  let h = `<div class="q-top"><span class="q-num">Question ${q.id}</span><span class="tag">${TYPE_LABEL[q.type]}</span>${q.topic?`<span class="tag topic">${esc(q.topic)}</span>`:""}</div>`;
  h += `<div class="q-text">${paras(q.question)}</div>`;
  (q.images||[]).forEach((k,n)=>{ h += `<figure class="exhibit"><img src="${QIMG[k]}" alt="Question ${q.id} exhibit ${n+1}"><figcaption>Exhibit${q.images.length>1?" "+(n+1):""} · tap to enlarge</figcaption></figure>`; });

  if(q.options.length){
    const multi = q.type === "multiple-select";
    h += `<ul class="options" role="${multi?"group":"radiogroup"}">`;
    q.options.forEach(o=>{
      const checked = st.sel.includes(o.label);
      h += `<li><label class="opt ${checked?"selected":""} ${done?"locked":""}" data-l="${o.label}">
        <input type="${multi?"checkbox":"radio"}" name="q${q.id}" value="${o.label}" ${checked?"checked":""} ${done?"disabled":""}>
        <span class="lab">${o.label}.</span><span class="txt">${esc(o.text)}</span></label></li>`;
    });
    h += `</ul>`;
    if(multi) h += `<div class="select-hint">Select all answers that apply.</div>`;
  } else {
    h += `<div class="answer-area"><h3>Your Answer</h3>`;
    if(q.ia){
      h += renderIA(q, st, done);
    } else if(q.boxCount && q.yesNo){
      h += `<p class="notice">Select Yes or No for each statement in the exhibit above (Box 1 = first statement, Box 2 = second, …), then press <b>Check Answer</b>.</p>`;
      for(let b=1;b<=q.boxCount;b++){
        const v = st.boxes[b];
        h += `<div class="box-row"><span class="bl">Box ${b}</span><span class="seg" data-box="${b}">
          <button type="button" data-v="Yes" class="${v==="Yes"?"on":""}" ${done?"disabled":""}>Yes</button>
          <button type="button" data-v="No" class="${v==="No"?"on":""}" ${done?"disabled":""}>No</button></span></div>`;
      }
    } else {
      h += `<p class="notice">Work out your selections using the answer area in the exhibit above, then press <b>Reveal Answer</b> to compare with the correct answer and mark yourself.</p>`;
    }
    h += `</div>`;
  }

  const gradable = q.options.length || (q.boxCount && q.yesNo) || q.ia;
  h += `<div class="actions">
    ${gradable?`<button class="btn primary" id="checkBtn" ${done?"disabled":""}>Check Answer</button>`:""}
    <button class="btn warn" id="revealBtn" ${done?"disabled":""}>Reveal Answer</button>
    <button class="btn" id="resetBtn">Reset</button>
    <button class="btn next ${done?"":"hidden"}" id="nextBtn">${i===TOTAL-1?"🎉 Test Completed":"Next Question →"}</button>
  </div>
  <div id="fb"></div><div id="ap"></div>`;
  $("#qCard").innerHTML = h;

  if(done){ showFeedback(); showAnswerPanel(); applyMarks(); }
  bindQuestion();
  updateChrome();
  window.scrollTo({top:0,behavior:"instant" in window ? "instant" : "auto"});
}

function renderIA(q, st, done){
  const ia = q.ia, R = st.rows || {};
  let h = "";
  const dis = done ? "disabled" : "";
  if(ia.kind === "yesno"){
    h += `<p class="notice">Select Yes or No for each statement, then press <b>Check Answer</b>.</p>`;
    ia.rows.forEach((r,n)=>{
      const v = R[n];
      h += `<div class="ia-row" data-row="${n}"><div class="ia-label">${esc(r.label)}</div><span class="seg" data-row="${n}">
        <button type="button" data-v="Yes" class="${v==="Yes"?"on":""}" ${dis}>Yes</button>
        <button type="button" data-v="No" class="${v==="No"?"on":""}" ${dis}>No</button></span><div class="ia-fix"></div></div>`;
    });
    return h;
  }
  if(ia.kind === "select"){
    h += `<p class="notice">Choose the correct option from each drop-down list, then press <b>Check Answer</b>.</p>`;
  } else {
    h += `<p class="notice">${ia.kind==="order" ? "Put the actions in the correct order." : "Match an item to each target."} Drag an item onto a box, tap an item then tap a box, or pick from the drop-down. Items can be used more than once or not at all. Then press <b>Check Answer</b>.</p>`;
    h += `<div class="pool">${ia.pool.map(p=>`<button type="button" class="chip-item" draggable="${done?"false":"true"}" data-v="${esc(p)}" ${dis}>${esc(p)}</button>`).join("")}</div>`;
  }
  ia.rows.forEach((r,n)=>{
    const choices = r.choices || ia.pool, v = R[n] || "";
    h += `<div class="ia-row ${ia.kind!=="select"?"droppable":""}" data-row="${n}"><div class="ia-label">${ia.kind==="order"?`<b>${esc(r.label)}</b>`:esc(r.label)}</div>
      <select class="ia-select" data-row="${n}" ${dis}><option value="">— Select —</option>${choices.map(c=>`<option value="${esc(c)}" ${c===v?"selected":""}>${esc(c)}</option>`).join("")}</select><div class="ia-fix"></div></div>`;
  });
  return h;
}

function bindQuestion(){
  const i = S.cur, q = QUESTIONS[i], st = qs(i);
  document.querySelectorAll(".opt input").forEach(inp=>{
    inp.addEventListener("change", ()=>{
      if(isDone(st)) return;
      if(q.type === "multiple-select"){
        st.sel = [...document.querySelectorAll(".opt input:checked")].map(x=>x.value);
      } else st.sel = [inp.value];
      document.querySelectorAll(".opt").forEach(l=>l.classList.toggle("selected", st.sel.includes(l.dataset.l)));
      save();
    });
  });
  document.querySelectorAll(".seg button").forEach(b=>{
    b.addEventListener("click", ()=>{
      if(isDone(st)) return;
      if(b.parentElement.dataset.row !== undefined){ st.rows = st.rows||{}; st.rows[b.parentElement.dataset.row] = b.dataset.v; }
      else { const box = b.parentElement.dataset.box; st.boxes[box] = b.dataset.v; }
      b.parentElement.querySelectorAll("button").forEach(x=>x.classList.toggle("on", x===b));
      save();
    });
  });
  const setRow = (n, v)=>{ if(isDone(st)) return; st.rows = st.rows||{}; st.rows[n] = v; const s = document.querySelector(`.ia-select[data-row="${n}"]`); if(s) s.value = v; save(); };
  document.querySelectorAll(".ia-select").forEach(s=> s.addEventListener("change", ()=> setRow(s.dataset.row, s.value)));
  let picked = null;
  document.querySelectorAll(".chip-item").forEach(c=>{
    c.addEventListener("dragstart", e=>{ if(isDone(st)){ e.preventDefault(); return; } e.dataTransfer.effectAllowed = "copy"; e.dataTransfer.setData("text/plain", c.dataset.v); });
    c.addEventListener("click", ()=>{ if(isDone(st)) return; picked = (picked===c.dataset.v) ? null : c.dataset.v;
      document.querySelectorAll(".chip-item").forEach(x=>x.classList.toggle("picked", x.dataset.v===picked)); });
  });
  window.__iaDrop = (n, v)=> setRow(n, v);
  window.__iaDone = ()=> isDone(st);
  document.querySelectorAll(".ia-row.droppable").forEach(row=>{
    row.addEventListener("click", e=>{ if(!picked || e.target.closest("select")) return; setRow(row.dataset.row, picked); picked=null;
      document.querySelectorAll(".chip-item").forEach(x=>x.classList.remove("picked")); });
  });
  const cb = $("#checkBtn"); if(cb) cb.addEventListener("click", check);
  $("#revealBtn").addEventListener("click", reveal);
  $("#resetBtn").addEventListener("click", resetQ);
  $("#nextBtn").addEventListener("click", next);
}

function sameSet(a,b){ if(a.length!==b.length) return false; const s=new Set(a); return b.every(x=>s.has(x)); }

function check(){
  const i = S.cur, q = QUESTIONS[i], st = qs(i), a = answerFor(q.id);
  if(q.options.length){
    if(!st.sel.length){ flash("Select an answer before checking."); return; }
    st.status = sameSet(st.sel, a.correctAnswer) ? "correct" : "incorrect";
  } else if(q.ia){
    const R = st.rows || {};
    if(q.ia.rows.some((r,n)=>!R[n])){ flash("Make a selection for every row before checking."); return; }
    st.status = a.rowAnswers.every((ans,n)=> R[n]===ans) ? "correct" : "incorrect";
  } else {
    for(let b=1;b<=q.boxCount;b++){ if(!st.boxes[b]){ flash("Make a Yes/No selection for every box before checking."); return; } }
    const ok = a.boxes.every(bx => (st.boxes[bx.box]||"") === bx.value.replace(/\.$/,"").trim());
    st.status = ok ? "correct" : "incorrect";
  }
  finish();
}
function reveal(){
  const q = QUESTIONS[S.cur], st = qs(S.cur), a = answerFor(q.id);
  st.status = "revealed"; st.hasKey = !!(a.correctAnswer || (a.boxes && a.boxes.length) || (a.explanation && a.explanation.length) || (a.answerImages && a.answerImages.length));
  if(!st.hasKey) st.status = "reviewed";
  finish();
}
function finish(){
  if(S.cur === S.furthest && S.furthest < TOTAL-1) S.furthest = S.cur + 1;
  if(S.cur === TOTAL-1) S.finished = true;
  save(); render();
}
function flash(msg){ $("#fb").innerHTML = `<div class="feedback info">${esc(msg)}</div>`; }

function showFeedback(){
  const st = qs(S.cur); let cls, txt;
  if(st.status==="correct"){ cls="ok"; txt = st.self ? "✓ Marked as correct (self-assessed)." : "✓ Correct!"; }
  else if(st.status==="incorrect"){ cls="bad"; txt = st.self ? "✗ Marked as incorrect (self-assessed)." : "✗ Incorrect. Review the correct answer below."; }
  else if(st.status==="revealed"){
    cls="warn"; txt="👁 Answer revealed — not scored.";
    const q = QUESTIONS[S.cur], a = answerFor(q.id);
    let tot=0, right=0;
    if(q.ia && a.rowAnswers){ const R=st.rows||{}; a.rowAnswers.forEach((ans,n)=>{ if(R[n]){ tot++; if(R[n]===ans) right++; } }); }
    else if(q.boxCount && q.yesNo && a.boxes){ a.boxes.forEach(bx=>{ const m=st.boxes[bx.box]; if(m){ tot++; if(m===bx.value.replace(/\.$/,"").trim()) right++; } }); }
    else if(q.options.length && st.sel.length){ tot=1; right = sameSet(st.sel, a.correctAnswer)?1:0; }
    if(tot){ txt += q.options.length ? (right ? " Your selection was correct." : " Your selection was wrong.") : ` ${right} of ${tot} of your selections were correct — wrong ones are marked in red.`; }
    else txt += " You did not answer this question.";
  }
  else { cls="warn"; txt="👁 Reviewed — no answer key in the source for this question."; }
  $("#fb").innerHTML = `<div class="feedback ${cls}">${txt}</div>`;
}

function showAnswerPanel(){
  const q = QUESTIONS[S.cur], st = qs(S.cur), a = answerFor(q.id);
  let h = `<div class="answer-panel">`;
  h += `<h4>Correct Answer</h4>`;
  if(a.correctAnswer){ h += `<div class="ca">${a.correctAnswer.join(", ")}</div>`; }
  else if(q.ia && a.rowAnswers){ h += `<ul>${q.ia.rows.map((r,n)=>`<li>${esc(r.label)} → <b>${esc(a.rowAnswers[n])}</b></li>`).join("")}</ul>`; }
  else if(a.boxes && a.boxes.length){ h += `<ul>${a.boxes.map(b=>`<li><b>Box ${b.box}:</b> ${esc(b.value)}</li>`).join("")}</ul>`; }
  else if((a.answerImages||[]).length){ /* answer shown as image below */ }
  else if(a.explanation && a.explanation.length){ h += `<p>See explanation below.</p>`; }
  else { h += `<p class="na">No answer is given in the source document for this question.</p>`; }
  (a.answerImages||[]).forEach(k=>{ h += `<figure class="exhibit"><img src="${AIMG[k]}" alt="Question ${q.id} answer"><figcaption>Answer · tap to enlarge</figcaption></figure>`; });
  if(a.explanation && a.explanation.length){
    h += `<h4>Explanation</h4>` + a.explanation.map(e=> typeof e === "string" ? `<p>${esc(e)}</p>` : `<figure class="exhibit"><img src="${AIMG[e.img]}" alt="Explanation image"></figure>`).join("");
  }
  if(a.reference && a.reference.length){ h += `<h4>Reference</h4>${a.reference.map(r=>`<p>${linkify(r)}</p>`).join("")}`; }
  // self-assessment for keyed questions that cannot be auto-graded
  const gradable = q.options.length || (q.boxCount && q.yesNo) || q.ia;
  if(!gradable && st.status==="revealed" && st.hasKey && !st.self){
    h += `<div class="self-grade"><span>Did you get it right?</span><button class="btn" id="sgOk">✓ I got it right</button><button class="btn" id="sgBad">✗ I got it wrong</button></div>`;
  }
  h += `</div>`;
  $("#ap").innerHTML = h;
  const ok = $("#sgOk"), bad = $("#sgBad");
  if(ok){ ok.onclick = ()=>{ st.status="correct"; st.self=true; save(); render(); };
          bad.onclick = ()=>{ st.status="incorrect"; st.self=true; save(); render(); }; }
}

function applyMarks(){
  const q = QUESTIONS[S.cur], st = qs(S.cur), a = answerFor(q.id);
  if(q.options.length && a.correctAnswer){
    document.querySelectorAll(".opt").forEach(l=>{
      const L = l.dataset.l;
      if(a.correctAnswer.includes(L)) l.classList.add("is-correct");
      else if(st.sel.includes(L)) l.classList.add("is-wrong");
    });
  }
  if(q.ia && a.rowAnswers){
    const R = st.rows || {};
    a.rowAnswers.forEach((ans,n)=>{
      const row = document.querySelector(`.ia-row[data-row="${n}"]`); if(!row) return;
      const mine = R[n], fix = row.querySelector(".ia-fix");
      if(mine){
        const ok = mine===ans;
        row.classList.add(ok?"row-ok":"row-bad");
        fix.className = "ia-fix " + (ok?"ok":"bad");
        fix.innerHTML = ok ? `✓ Your answer is correct` : `✗ Your answer "${esc(mine)}" is wrong — correct answer: <b>${esc(ans)}</b>`;
      } else {
        fix.className = "ia-fix info";
        fix.innerHTML = `Correct answer: <b>${esc(ans)}</b>`;
      }
      const seg = row.querySelector(".seg");
      if(seg) seg.querySelectorAll("button").forEach(b=>{ b.classList.remove("on"); if(b.dataset.v===ans) b.classList.add("good"); else if(mine===b.dataset.v) b.classList.add("badc"); });
    });
  }
  if(q.boxCount && q.yesNo && a.boxes){
    a.boxes.forEach(bx=>{
      const seg = document.querySelector(`.seg[data-box="${bx.box}"]`); if(!seg) return;
      const right = bx.value.replace(/\.$/,"").trim();
      seg.querySelectorAll("button").forEach(b=>{
        b.classList.remove("on");
        if(b.dataset.v===right) b.classList.add("good");
        else if(st.boxes[bx.box]===b.dataset.v) b.classList.add("badc");
      });
    });
  }
}

function resetQ(){
  const id = QUESTIONS[S.cur].id;
  S.q[id] = {sel:[], boxes:{}, rows:{}, status:null};
  save(); render();
}
function next(){
  if(!isDone(qs(S.cur))) return;
  if(S.cur === TOTAL-1){ showComplete(); return; }
  go(S.cur+1);
}
function go(i){
  if(i<0 || i>=TOTAL || i> S.furthest) return;   // future questions are locked
  S.cur = i; save(); render(); closeNav();
}

/* ---------- chrome: header, navigator ---------- */
let filter = "all";
function counts(){
  let c={correct:0,incorrect:0,revealed:0,done:0};
  QUESTIONS.forEach(q=>{ const st=S.q[q.id]; if(st&&st.status){ c.done++; if(st.status==="correct")c.correct++; else if(st.status==="incorrect")c.incorrect++; else c.revealed++; } });
  return c;
}
function updateChrome(){
  const c = counts();
  $("#progText").textContent = `Question ${S.cur+1} of ${TOTAL}`;
  const pct = Math.round(c.done/TOTAL*100);
  $("#progPct").textContent = `${c.done} attempted · ${pct}%`;
  $("#progBar").style.width = pct+"%";
  $("#stOk").textContent = "✓ "+c.correct; $("#stBad").textContent = "✗ "+c.incorrect; $("#stRev").textContent = "👁 "+c.revealed;
  renderNav();
}
function renderNav(){
  const term = $("#search").value.trim().toLowerCase();
  let h = "", shown = 0;
  QUESTIONS.forEach((q,i)=>{
    const locked = i > S.furthest;
    const st = S.q[q.id]; const status = st && st.status;
    // search & filters only ever look at unlocked questions, so they never expose future content
    if(term || filter!=="all"){
      if(locked) return;
      if(term){
        const hay = (String(q.id)+" "+q.question.join(" ")+" "+q.options.map(o=>o.text).join(" ")).toLowerCase();
        if(!(String(q.id)===term || hay.includes(term))) return;
      }
      if(filter==="correct" && status!=="correct") return;
      if(filter==="incorrect" && status!=="incorrect") return;
      if(filter==="revealed" && !(status==="revealed"||status==="reviewed")) return;
    }
    const cls = [ "nav-btn", i===S.cur?"current":"", locked?"locked":"", status==="correct"?"correct":"", status==="incorrect"?"incorrect":"", (status==="revealed"||status==="reviewed")?"revealed":"" ].join(" ");
    h += `<button class="${cls}" data-i="${i}" ${locked?'aria-disabled="true" title="Locked — answer the current question first"':`title="Question ${q.id}"`}>${q.id}</button>`;
    shown++;
  });
  if(!shown) h = `<div class="nav-empty">No unlocked questions match.</div>`;
  $("#navGrid").innerHTML = h;
  const cur = $("#navGrid .nav-btn.current");
  if(cur){ const g = $("#navGrid"); const top = cur.offsetTop - g.offsetTop; if(top < g.scrollTop || top > g.scrollTop + g.clientHeight - 40) g.scrollTop = top - 60; }
}
$("#navGrid").addEventListener("click", e=>{
  const b = e.target.closest(".nav-btn"); if(!b) return;
  const i = +b.dataset.i; if(i > S.furthest) return; go(i);
});
$("#search").addEventListener("input", renderNav);
$("#filters").addEventListener("click", e=>{
  const c = e.target.closest(".chip"); if(!c) return;
  filter = c.dataset.f; document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("active", x===c)); renderNav();
});

/* ---------- completion ---------- */
function showComplete(){
  const c = counts();
  const graded = c.correct + c.incorrect;
  const pct = graded ? Math.round(c.correct/graded*100) : 0;
  $("#qCard").classList.add("hidden");
  const d = $("#doneCard"); d.classList.remove("hidden");
  d.innerHTML = `<h2>🎉 Test Completed</h2><p style="color:var(--muted)">You reached the end of all ${TOTAL} questions.</p>
    <div class="score-big">${pct}%</div><p style="color:var(--muted);margin:0">score on ${graded} graded question${graded===1?"":"s"}</p>
    <div class="res-grid">
      <div class="res"><b style="color:var(--ok)">${c.correct}</b><small>Correct</small></div>
      <div class="res"><b style="color:var(--bad)">${c.incorrect}</b><small>Incorrect</small></div>
      <div class="res"><b style="color:var(--warn)">${c.revealed}</b><small>Revealed / reviewed</small></div>
      <div class="res"><b>${TOTAL}</b><small>Total questions</small></div>
    </div>
    <div class="actions" style="justify-content:center"><button class="btn" id="reviewBtn">Review questions</button><button class="btn primary" id="restartBtn">Restart Test</button></div>`;
  $("#restartBtn").onclick = restart;
  $("#reviewBtn").onclick = ()=>go(0);
  updateChrome();
  window.scrollTo(0,0);
}
function restart(){
  S = freshState(); try{ localStorage.removeItem(STORE_KEY); }catch(e){}
  $("#search").value=""; filter="all"; document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("active", x.dataset.f==="all"));
  render();
}

/* ---------- mobile nav & theme ---------- */
function closeNav(){ $("#sidebar").classList.remove("open"); $("#backdrop").classList.remove("open"); }
$("#menuBtn").onclick = ()=>{ $("#sidebar").classList.add("open"); $("#backdrop").classList.add("open"); };
$("#backdrop").onclick = closeNav;
$("#themeBtn").onclick = ()=>{
  const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark"; try{ localStorage.setItem("exam-theme", r.dataset.theme); }catch(e){}
};
try{ const t = localStorage.getItem("exam-theme"); if(t) document.documentElement.dataset.theme = t; }catch(e){}
document.addEventListener("keydown", e=>{
  if(e.target.matches("input[type=search]")) return;
  if(e.key==="ArrowRight"){ const nb=$("#nextBtn"); if(nb && !nb.classList.contains("hidden") && $("#doneCard").classList.contains("hidden")) next(); }
  if(e.key==="ArrowLeft" && S.cur>0) go(S.cur-1);
});

function dropRow(e){ const el = e.target && e.target.closest ? e.target : e.target.parentElement; return el ? el.closest(".ia-row.droppable") : null; }
document.addEventListener("dragover", e=>{
  const row = dropRow(e); document.querySelectorAll(".ia-row.over").forEach(r=>{ if(r!==row) r.classList.remove("over"); });
  if(!row || !window.__iaDone || window.__iaDone()) return;
  e.preventDefault(); e.dataTransfer.dropEffect = "copy"; row.classList.add("over");
}, true);
document.addEventListener("drop", e=>{
  const row = dropRow(e); document.querySelectorAll(".ia-row.over").forEach(r=>r.classList.remove("over"));
  if(!row || !window.__iaDone || window.__iaDone()) return;
  e.preventDefault(); e.stopPropagation();
  const v = e.dataTransfer.getData("text/plain"); if(v && window.__iaDrop) window.__iaDrop(row.dataset.row, v);
}, true);
document.addEventListener("dragend", ()=> document.querySelectorAll(".ia-row.over").forEach(r=>r.classList.remove("over")));
document.addEventListener("click", e=>{
  const img = e.target.closest(".exhibit img"); if(!img) return;
  const lb = document.createElement("div"); lb.className="lightbox"; lb.innerHTML = `<img src="${img.src}" alt="">`;
  lb.onclick = ()=>lb.remove(); document.body.appendChild(lb);
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape"){ const lb=document.querySelector(".lightbox"); if(lb) lb.remove(); } });
if(S.cur > S.furthest) S.cur = S.furthest;
render();
})();
</script>
</body>
</html>
